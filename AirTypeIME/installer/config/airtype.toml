# AirTypeIME 默认配置
# 局域网内让 AirMic Node 直连时，把 bind 改成 "0.0.0.0"

[server]
bind = "127.0.0.1"
port = 8765
path = "/ws"

[audio]
sample_rate = 16000
channels = 1
bits_per_sample = 16
frame_ms = 20
max_utterance_ms = 60000

[asr]
# mock | command | sherpa（推荐，内嵌 sherpa-onnx，见 airtype-sherpa.toml）
engine = "sherpa"
# command 模式：把 {wav} 替换成临时 WAV 路径，进程 stdout 首行作为识别文本
command = "python tools/asr_bridge.py {wav}"
timeout_ms = 20000
mock_text = "你好，这是一次 AirType 语音输入测试。"

# 内嵌 sherpa-onnx 引擎参数（engine = "sherpa" 时生效）。
# model_dir 相对「本配置文件所在目录」解析：安装后配置在
# %ProgramFiles%\AirType\config\airtype.toml，模型在 %ProgramFiles%\AirType\models\...，
# 故写 ../models/...。自动扫描 fp32 的 encoder/decoder/joiner 与 tokens.txt。
[sherpa]
model_dir = "../models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20"
encoder = ""
decoder = ""
joiner = ""
tokens = ""
num_threads = 4
provider = "cpu"
modeling_unit = "cjkchar"
decoding_method = "greedy_search"
enable_endpoint = false
# 热词表：每行一个词或短语，# 开头是注释（AirType 自己过滤，不会传给 sherpa）。
# 用于修正模型系统性听错的词，典型是中英混说时中文短词被英文吞掉：
# "Today is 礼拜二" 会被听成 "Today is Libr"。写进 hotwords.txt 后就能正确识别。
# 注意：启用热词会自动切到 modified_beam_search 解码（更准但慢约 20%）。
# 相对路径按「配置文件目录 → CWD」解析；留空 = 不启用。
hotwords_file = "hotwords.txt"
hotwords_score = 1.5

# 流式语音降噪（DPDFNet）。嘈杂环境（办公室/车里）建议开；安静环境关掉
# 可以省约 20MB 内存。模型 9.8MB，onnxruntime 走动态加载（见 runtime）。
# 注意：降噪在 ASR 之前，音频电平表也基于降噪后的信号。
[denoise]
enabled = true
model_dir = "../models/dpdfnet"
model = "dpdfnet2.onnx"
runtime = "../lib/onnxruntime.dll"
# 抑制上限（dB），对应官方 apply_attn_limit。
# 0 = 完全不降噪；数值越大降噪越狠；省略这一行按 3.0 处理。
# 实测最稳档位是 3：干净语音 CER 0%（几乎无损），5dB 噪声下 69% → 21%。
# 别设成几十以上——纯模型输出对干净语音是灾难（CER 0% → 26%）。
attn_limit_db = 3

# 边说边出字（partial 实时上屏）。默认开启：说的时候字就陆续出现，
# 松键后只补最后一点。想要「松键后一次性给完整文本」，把 enabled 改成 false。
# chunk_ms 是攒多久音频请求一次识别，越小越"逐字"，但解码更频繁（默认 200）。
[streaming]
enabled = true

[postprocess]
trim_filler_words = true
normalize_numbers = true
ensure_punctuation = true
collapse_whitespace = true
# 英文全大写还原成首字母大写（zipformer 词表本身是大写，出来是 TODAY IS）。
normalize_english_case = true
# 中英之间补空格：`Today is礼拜二` → `Today is 礼拜二`。
# 只处理含字母的英文词，`3月` / `第2种` 这类数字+中文不动。
space_cjk_latin = true

[inject]
# none | clipboard_paste
# none：只把最终文本写进日志，不碰系统剪贴板和按键（无头验证用）
# clipboard_paste：保存剪贴板 -> 写入文本 -> 模拟 Ctrl+V -> 恢复剪贴板
mode = "none"
restore_clipboard = true
paste_delay_ms = 40

# 内置设置页面：浏览器打开 http://127.0.0.1:8766/ 改配置并保存
[web]
enabled = true
bind = "127.0.0.1"   # 保持本机；改 "0.0.0.0" 会让同局域网的人都能改你的设置
port = 8766
