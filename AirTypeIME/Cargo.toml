[workspace]
resolver = "2"
members = [
    "crates/airtype-core",
    "crates/airtype-daemon",
    "crates/airtype-ffi",
    "crates/airtype-asr-sherpa",
    "crates/airtype-denoise",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["xuefei"]

[workspace.dependencies]
airtype-core = { path = "crates/airtype-core" }
airtype-daemon = { path = "crates/airtype-daemon" }
airtype-asr-sherpa = { path = "crates/airtype-asr-sherpa" }
airtype-denoise = { path = "crates/airtype-denoise" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
