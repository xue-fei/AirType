; AirMic Node — ESP32-S3 SuperMini + INMP441 + PTT 按键 + 板载 WS2812
;
; 常用命令（pio 未在 PATH 时统一用 `python -m platformio`）：
;   python -m platformio run -d . -e supermini              # 编译
;   python -m platformio run -d . -e supermini -t upload    # 烧录
;   python -m platformio device monitor -d . -b 115200      # 串口日志
;   python -m platformio test -d . -e native                # 帧协议单测（无需硬件）

[platformio]
default_envs = supermini

; ---- ESP32-S3 SuperMini（目标板）--------------------------------------
; ESP32-S3FH4R2：4MB Flash + 2MB PSRAM（quad QSPI），原生 USB-C，
; 板载 WS2812 在 GPIO48。引脚 2.54mm 间距、半孔+通孔混合，可焊排针或贴焊载板。
[env:supermini]
; 6.10.x = Arduino-ESP32 2.0.17 / IDF 4.4，旧版 driver/i2s.h API 稳定，
; WebSockets 库兼容性最好。换 Arduino 3.x 需改用 driver/i2s_std.h。
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1          ; SuperMini 无官方 board 定义，借用 DevKitC-1
framework = arduino

board_upload.flash_size = 4MB       ; 板载 4MB Flash（默认 board 配置按 8MB 会超）
board_build.partitions = default.csv
board_build.flash_mode = qio
board_build.psram_type = qio        ; FH4R2 是 quad PSRAM；octal 版要同时把下一行改成 opi_opi
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1            ; 原生 USB（板上无 USB 转串口芯片）
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial 走 USB CDC，否则日志只到 GPIO43/44

lib_deps =
    links2004/WebSockets@^2.3.6
    adafruit/Adafruit NeoPixel@^1.12.0

; ---- 通用 DevKitC-1 / 其他 "ESP32-S3 Mini" 底板 ----------------------
; 仅用于换板时对照， SuperMini 请用上面的 supermini 环境。
[env:esp32s3]
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

lib_deps =
    links2004/WebSockets@^2.3.6
    adafruit/Adafruit NeoPixel@^1.12.0

[env:native]
; 纯主机单元测试：只编译不依赖 Arduino 的纯逻辑模块
platform = native
test_framework = unity
; pio test 默认不编译 src/，必须显式打开才能把纯逻辑模块链进测试程序
test_build_src = yes
build_flags =
    -std=c++11
    -Wall
build_src_filter = +<protocol.cpp> +<wifi_credentials.cpp>
