; AirMic Node — ESP32-S3 Mini + INMP441 + PTT 按键 + 状态灯
;
; 常用命令（pio 未在 PATH 时统一用 `python -m platformio`）：
;   python -m platformio run -d . -e esp32s3              # 编译
;   python -m platformio run -d . -e esp32s3 -t upload    # 烧录
;   python -m platformio device monitor -d . -b 115200    # 串口日志
;   python -m platformio test -d . -e native              # 帧协议单测（无需硬件）

[platformio]
default_envs = esp32s3

[env:esp32s3]
; 6.10.x = Arduino-ESP32 2.0.17 / IDF 4.4，旧版 driver/i2s.h API 稳定，
; WebSockets 库兼容性最好。换 Arduino 3.x 需改用 driver/i2s_std.h。
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

lib_deps =
    links2004/WebSockets@^2.3.6
    adafruit/Adafruit NeoPixel@^1.12.0

; 板型可按实际硬件改：
;   lolin_s3_mini         -> WEMOS/Lolin S3 Mini
;   seeed_xiao_esp32s3    -> Seeed XIAO ESP32S3
;   esp32-s3-devkitc-1    -> 通用 DevKitC-1 / 多数 "ESP32-S3 Mini" 底板
; 若板子带 OPI PSRAM，追加：board_build.arduino.memory_type = qio_opi

[env:native]
; 纯主机单元测试：只编译不依赖 Arduino 的 protocol.cpp
platform = native
test_framework = unity
; pio test 默认不编译 src/，必须显式打开才能把 protocol.cpp 链进测试程序
test_build_src = yes
build_flags =
    -std=c++11
    -Wall
build_src_filter = +<protocol.cpp>
